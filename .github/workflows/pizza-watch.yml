name: Pizza Watch scan
on:
  schedule:
    - cron: "*/15 * * * *"     # every 15 min (GitHub may run it a few minutes late)
  workflow_dispatch:            # lets you tap "Run workflow" from your phone
  push:                         # every deploy starts with a fresh scan
    branches: [main]
    paths-ignore: [feed.json, pizza_history.jsonl]
permissions:
  contents: write
concurrency: pizza-watch
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install requests playwright
          python -m playwright install --with-deps chromium
      - name: Scan Google Maps
        env:
          GOOGLE_STATE: ${{ secrets.GOOGLE_STATE }}   # signed-in session (see README)
        run: python collector.py --once
      - name: Save readings
        run: |
          git config user.name "pizza-watch-bot"
          git config user.email "pizza-watch-bot@users.noreply.github.com"
          git add feed.json pizza_history.jsonl
          git commit -m "scan $(date -u +%H:%M)" || exit 0
          git push
